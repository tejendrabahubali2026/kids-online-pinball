# Hosting configuration for the optional Space Pinball Blast leaderboard.
#
# `pages_build_output_dir` is required by the hosting platform's project mode;
# without it this file is ignored.
#
# IMPORTANT: set `database_id` below to the id printed when you create your own
# database. The value committed here is the maintainer's own database and must
# be replaced before you deploy your own copy, otherwise submissions from your
# site will be written to someone else's board.

name = "space-pinball-blast"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "space-pinball-leaderboard"
database_id = "286a2c53-185f-4912-86ff-cf4d09e8a173"
migrations_dir = "migrations"

# Local development uses a throwaway local database instance created by the
# migration command in the project's setup notes.
